[project]
name = "gitlab-security-mcp"
version = "1.0.0"
description = "Local-only MCP server that verifies GitLab security findings and applies minimal fixes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2,<3",
    "httpx>=0.27",
    "packaging>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gitlab-security-mcp = "gitlab_security_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
