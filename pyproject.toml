[project]
name = "gitlab-security-mcp"
version = "1.0.0"
description = "Local-only MCP server that verifies GitLab security findings and applies minimal fixes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2,<3",
    "httpx>=0.27",
    "packaging>=24",
    "ruamel.yaml>=0.18,<0.19",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14,<1"]

[project.scripts]
gitlab-security-mcp = "gitlab_security_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
extend-exclude = ["build", "dist", "*.egg-info", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "D"]
ignore = ["E501", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
